[pytest]
testpaths = tests
base_url = https://www.saucedemo.com
addopts = -ra --strict-markers --screenshot=only-on-failure --tracing=retain-on-failure --output=reports/artifacts
markers =
    smoke: fast checks of the critical user path
    regression: full functional coverage
    negative: invalid input and error handling
    known_issue: documents behavior of intentionally flawed demo users
