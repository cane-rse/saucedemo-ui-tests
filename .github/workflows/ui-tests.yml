name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"   # weekly, Mondays 13:00 UTC

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: >
          pytest --browser ${{ matrix.browser }}
          --html=reports/report-${{ matrix.browser }}.html --self-contained-html

      - name: Upload report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.browser }}
          path: reports/
